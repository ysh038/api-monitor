plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.ysh038'
version = '1.2.0'

java {
    // Spring Boot 3.x/4.x 모두 Java 17 이상이므로 17 바이트코드로 빌드한다.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
}

// 내장 대시보드 화면: dashboard-ui(React) 빌드 결과(dist/)를 jar 에 넣는다.
// 스타터를 쓰는 앱은 Node 가 필요 없다. Node 는 스타터를 빌드·배포하는 쪽에서만 필요하다.
// -PskipDashboardBuild : npm 빌드를 건너뛰고 이미 있는 dashboard-ui/dist 를 그대로 쓴다 (build.sh 등)
def dashboardDir = rootProject.file('../dashboard-ui')
def dashboardDist = new File(dashboardDir, 'dist')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmCiDashboard', Exec) {
    onlyIf { !project.hasProperty('skipDashboardBuild') }
    workingDir dashboardDir
    commandLine npmCommand, 'ci', '--no-audit', '--no-fund'
    inputs.file(new File(dashboardDir, 'package-lock.json'))
    outputs.dir(new File(dashboardDir, 'node_modules'))
}

tasks.register('buildDashboard', Exec) {
    onlyIf { !project.hasProperty('skipDashboardBuild') }
    dependsOn 'npmCiDashboard'
    workingDir dashboardDir
    commandLine npmCommand, 'run', 'build'
    inputs.dir(new File(dashboardDir, 'src'))
    inputs.files(new File(dashboardDir, 'index.html'), new File(dashboardDir, 'package.json'), new File(dashboardDir, 'vite.config.ts'))
    inputs.dir(new File(dashboardDir, 'public'))
    outputs.dir(dashboardDist)
}

tasks.named('processResources') {
    dependsOn 'buildDashboard'
    inputs.dir(dashboardDist).optional()
    doFirst {
        if (!new File(dashboardDist, 'index.html').isFile()) {
            throw new GradleException("대시보드 화면이 없습니다: ${dashboardDist}/index.html\n" +
                    "dashboard-ui 에서 'npm ci && npm run build' 를 먼저 실행하세요.")
        }
    }
    from(dashboardDist) {
        into 'META-INF/api-monitor/dashboard'
    }
}

// 모든 의존성은 compileOnly: 앱이 이미 가진 Spring/Servlet/SLF4J를 그대로 쓰고,
// 스타터가 앱에 새 라이브러리(버전 충돌 요소)를 끌고 들어가지 않는다.
dependencies {
    compileOnly platform('org.springframework.boot:spring-boot-dependencies:4.0.5')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.0.5')

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'org.slf4j:slf4j-api'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // 테스트 전용 (배포 jar·POM 의존성에는 포함되지 않음)
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.0.5')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework:spring-webmvc'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.slf4j:slf4j-api'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Maven Central (Central Portal) 배포
// 필요한 값 (~/.gradle/gradle.properties):
//   mavenCentralUsername, mavenCentralPassword   ← Portal의 User Token
//   signing.gnupg.keyName, signing.gnupg.passphrase   ← 로컬 gpg 키 (gpg 명령으로 서명)
//   (또는 signingInMemoryKey, signingInMemoryKeyId, signingInMemoryKeyPassword)
// 배포: ./gradlew publishToMavenCentral   (Portal에서 Publish 눌러 최종 공개)
mavenPublishing {
    publishToMavenCentral()
    // 서명 키가 설정된 경우에만 서명 (로컬 테스트용 publishToMavenLocal은 키 없이도 동작)
    if (providers.gradleProperty('signingInMemoryKey').isPresent() || providers.gradleProperty('signing.keyId').isPresent()
            || providers.gradleProperty('signing.gnupg.keyName').isPresent()) {
        signAllPublications()
    }
    coordinates('io.github.ysh038', 'api-monitor-spring-boot-starter', version.toString())

    pom {
        name = 'API Monitor Spring Boot Starter'
        description = 'Add one dependency to a Spring Boot app to capture inbound requests, responses, exceptions and outbound HTTP calls, and browse them on a built-in dashboard at /_api-monitor.'
        inceptionYear = '2026'
        url = 'https://github.com/ysh038/api-monitor'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'ysh038'
                name = 'ysh038'
                url = 'https://github.com/ysh038'
            }
        }
        scm {
            url = 'https://github.com/ysh038/api-monitor'
            connection = 'scm:git:git://github.com/ysh038/api-monitor.git'
            developerConnection = 'scm:git:ssh://git@github.com/ysh038/api-monitor.git'
        }
    }
}

// 로컬 gpg 키로 서명 (signing.gnupg.keyName 이 있을 때)
if (providers.gradleProperty('signing.gnupg.keyName').isPresent()) {
    signing {
        useGpgCmd()
    }
}
