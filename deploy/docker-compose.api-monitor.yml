# 대시보드를 compose로 띄우고 싶을 때 쓰는 파일 (install-dashboard.sh 대신 사용 가능)
#   docker compose -f docker-compose.api-monitor.yml up -d
#
# 앱 쪽 설정은 필요 없습니다. 스타터가 같은 서버의 대시보드(8090)를 자동으로 찾아 연결합니다.
# 이 블록을 앱의 docker-compose.yaml services: 아래에 넣어 같은 네트워크로 띄워도 됩니다
# (그 경우 스타터는 http://api-monitor:8081 로 연결합니다).
services:
  api-monitor:
    image: api-monitor-server:1.0.0
    container_name: api-monitor
    restart: unless-stopped
    ports:
      - "8090:8081"            # 포트를 바꾸면 앱에 API_MONITOR_DISCOVERY_PORT=<포트> 필요
    environment:
      - RETENTION_DAYS=30
      # - INGEST_API_KEY=바꿀값  # 설정하면 앱에 API_MONITOR_API_KEY도 같은 값 필요
    volumes:
      - api-monitor-data:/data

volumes:
  api-monitor-data:
